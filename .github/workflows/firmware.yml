name: Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Cache APT downloads
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/apt-cache/*.deb
          key: ubuntu-26.04-${{ runner.arch }}-apt-${{ hashFiles('.github/workflows/firmware.yml') }}
      - name: Install build and lint tools
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /usr/share/keyrings/llvm.asc > /dev/null
          echo "deb [signed-by=/usr/share/keyrings/llvm.asc] https://apt.llvm.org/resolute/ llvm-toolchain-resolute-23 main" \
            | sudo tee /etc/apt/sources.list.d/llvm23.list > /dev/null
          mkdir -p "$RUNNER_TEMP/apt-cache/partial"
          sudo apt-get update
          sudo apt-get -o Dir::Cache::archives="$RUNNER_TEMP/apt-cache" install --yes --no-install-recommends \
            gcc-avr binutils-avr avr-libc clang-format-23 clang-tidy-23
      - name: Check formatting
        run: clang-format-23 --dry-run --Werror src/*.c src/*.h
      - name: Run clang-tidy
        run: |
          clang-tidy-23 src/*.c -- --target=avr -mmcu=attiny202 \
            -std=c11 -fshort-enums -Isrc -isystem /usr/lib/avr/include
      - name: Build firmware
        run: make
      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: orbiter-attiny202-${{ github.sha }}
          path: build/orbiter.hex
          if-no-files-found: error
          retention-days: 90
