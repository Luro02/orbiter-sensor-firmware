name: Firmware

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13.5'
      - name: Install tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes gcc-14 g++-14 make
          python -m pip install clang-format==23.1.3 clang-tidy==23.1.4
          curl --fail --location --retry 3 -o "$RUNNER_TEMP/avr.tar.bz2" https://github.com/SpenceKonde/DxCore/raw/gh-pages/avr-gcc-7.3.0-atmel3.6.1-azduino8-x86_64-pc-linux-gnu.tar.bz2
          echo "ffce8ce1ef79bd6ec25a1a7154900966bcfdcd1731eb5d1e45c60e914a655e1d  $RUNNER_TEMP/avr.tar.bz2" | sha256sum --check
          mkdir "$RUNNER_TEMP/avr"
          tar -xjf "$RUNNER_TEMP/avr.tar.bz2" --strip-components=1 -C "$RUNNER_TEMP/avr"
          echo "$RUNNER_TEMP/avr/bin" >> "$GITHUB_PATH"
      - name: Check format and lint
        run: python tests/lint.py --avr-include "$RUNNER_TEMP/avr/avr/include"
      - name: Run complete regression matrix
        run: python tests/verify.py --avr-bin "$RUNNER_TEMP/avr/bin" --host-cc gcc-14 --host-cxx g++-14
      - name: Build downloadable firmware
        run: python tests/package_firmware.py --avr-bin "$RUNNER_TEMP/avr/bin" --revision "$GITHUB_SHA"
      - name: Upload firmware and build manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: orbiter-attiny202-${{ github.sha }}
          path: build/firmware-downloads/
          if-no-files-found: error
          retention-days: 90
      - name: Upload validation report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: validation-${{ github.sha }}
          path: build/verification/report.json
          if-no-files-found: error
